apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wine-demo-project
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/pekk4/mlops-demo3.git
    targetRevision: master
    path: manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: argo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
